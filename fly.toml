# Fly.io 배포 설정 (영구 볼륨으로 게임 저장)
# 처음 한 번: fly launch --no-deploy --copy-config  →  fly volumes create glg_data --size 1 --region nrt  →  fly deploy
app = "galrimgil-life"
primary_region = "nrt"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"
  TRUST_PROXY = "1"

[[mounts]]
  source = "glg_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
